name: bot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency: bot
permissions:
  contents: write
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - run: node bot/cli.mjs
      - name: Commit state
        run: |
          git config user.name "pueblo-bot"
          git config user.email "pueblo-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "bot: update state [skip ci]" && git pull --rebase && git push)
